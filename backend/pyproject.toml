[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanterm"
version = "0.1.0"
description = "Python async cryptocurrency trading terminal"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.136.1",
    "msgspec>=0.21.1",
    "requests>=2.34.2",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
]


[tool.hatch.build.targets.wheel]
packages = ["quanterm"]

[tool.basedpyright]
typeCheckingMode = "basic"


[tool.ruff]
target-version = "py314"
line-length = 120
