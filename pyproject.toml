[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanterm"
version = "0.1.0"
description = "Python async cryptocurrency trading terminal"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0.0" 
]

[tool.hatch.build.targets.wheel]
packages = ["quanterm"]

[tool.basedpyright]
# Sets the base level to 'basic' (equivalent to standard pyright's non-strict mode)
typeCheckingMode = "basic"
